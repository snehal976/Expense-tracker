<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker</title>
    
    <!-- Three.js for 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Tailwind Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: {
                            main: 'var(--bg-main)',
                            surface: 'var(--bg-surface)',
                            card: 'var(--bg-card)',
                        },
                        text: {
                            main: 'var(--text-main)',
                            muted: 'var(--text-muted)',
                            inverted: 'var(--text-inverted)'
                        },
                        border: {
                            DEFAULT: 'var(--border-color)'
                        },
                        primary: {
                            DEFAULT: 'var(--primary)',
                            hover: 'var(--primary-hover)',
                            fg: 'var(--primary-fg)',
                            light: 'var(--primary-light)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-15px) rotate(5deg)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables for Themes */
        :root {
            /* Default Dark Theme */
            --bg-main: #030712;    /* gray-950 */
            --bg-surface: rgba(17, 24, 39, 0.85); /* gray-900 with opacity for glass */
            --bg-card: #1f2937;    /* gray-800 */
            
            --text-main: #f3f4f6;  /* gray-100 */
            --text-muted: #9ca3af; /* gray-400 */
            --text-inverted: #000000;
            
            --border-color: #374151; /* gray-700 */
            
            --primary: #3b82f6;      /* blue-500 */
            --primary-hover: #2563eb; /* blue-600 */
            --primary-fg: #ffffff;
            --primary-light: rgba(59, 130, 246, 0.15);
        }

        [data-theme="light"] {
            --bg-main: #f3f4f6;    /* gray-100 */
            --bg-surface: rgba(255, 255, 255, 0.9);
            --bg-card: #ffffff;
            
            --text-main: #111827;  /* gray-900 */
            --text-muted: #6b7280; /* gray-500 */
            --text-inverted: #ffffff;
            
            --border-color: #e5e7eb; /* gray-200 */
            
            --primary: #2563eb;      /* blue-600 */
            --primary-hover: #1d4ed8; /* blue-700 */
            --primary-fg: #ffffff;
            --primary-light: rgba(37, 99, 235, 0.1);
        }

        [data-theme="neon"] {
            --bg-main: #000000;
            --bg-surface: rgba(10, 10, 10, 0.9);
            --bg-card: #121212;
            
            --text-main: #fbbf24;  /* amber-400 */
            --text-muted: #a16207; /* amber-700 */
            --text-inverted: #000000;
            
            --border-color: #f59e0b; /* amber-500 */
            
            --primary: #ffd700;      /* Gold */
            --primary-hover: #eab308; /* amber-500 */
            --primary-fg: #000000;
            --primary-light: rgba(255, 215, 0, 0.15);
        }

        /* Neon specific glows */
        [data-theme="neon"] .neon-border {
            box-shadow: 0 0 5px var(--border-color), inset 0 0 5px var(--border-color);
        }
        [data-theme="neon"] button.primary-btn {
            box-shadow: 0 0 10px var(--primary);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted); 
        }

        /* Enhanced Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes growWidth {
            from { width: 0; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        
        .animate-fadeIn { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .animate-slideIn { animation: slideInRight 0.3s ease-out forwards; }
        .animate-grow { animation: growWidth 1s ease-out forwards; }
        .animate-stagger { opacity: 0; animation: slideUp 0.4s ease-out forwards; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delayed { animation: float 6s ease-in-out 3s infinite; }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        /* Card Hover Effects */
        .card-hover {
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        [data-theme="neon"] .card-hover:hover {
            box-shadow: 0 0 15px var(--primary);
        }

        /* Glassmorphism */
        .glass-panel {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: var(--bg-surface);
        }

        /* Canvas Background */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }
        
        #app {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-bg-main text-text-main font-sans overflow-hidden transition-colors duration-500">

    <!-- 3D Background Container -->
    <div id="canvas-container"></div>

    <div id="app" class="flex h-screen w-full">
        <!-- Sidebar with Glass Effect -->
        <aside class="w-64 glass-panel border-r border-border hidden md:flex flex-col z-20 transition-colors duration-300">
            <div class="p-6">
                <div class="flex items-center gap-2 text-primary mb-8 animate-slideIn">
                    <div class="p-2 bg-primary-light rounded-lg">
                        <i data-lucide="wallet" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-text-main">ExpenseTracker</span>
                </div>
                <nav id="sidebar-nav" class="space-y-2">
                    <!-- Nav items injected here -->
                </nav>
            </div>
            <div class="mt-auto p-6 border-t border-border">
                <div class="flex items-center gap-3 animate-fadeIn delay-300">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-primary-hover flex items-center justify-center text-primary-fg font-bold text-sm shadow-lg shadow-primary/20">
                        Chief
                    </div>
                    <div>
                        <p class="text-sm font-medium text-text-main">Chief Lucifer</p>
                        
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col relative overflow-hidden transition-colors duration-300">
            <!-- Header with Glass Effect -->
            <header class="h-16 border-b border-border flex items-center justify-between px-6 glass-panel z-10 sticky top-0">
                <h1 id="page-title" class="text-xl font-bold capitalize text-text-main tracking-tight animate-slideIn">Dashboard</h1>
                <div class="flex items-center gap-4 animate-slideIn delay-100">
                    <!-- Theme Toggle Button -->
                    <button onclick="cycleTheme()" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-bg-card border border-border text-xs text-text-muted hover:text-text-main hover:border-primary transition-all cursor-pointer group shadow-sm hover:shadow-md" title="Click to switch theme">
                        <i data-lucide="palette" class="w-3 h-3 group-hover:text-primary transition-colors"></i>
                        <span id="current-theme-display" class="capitalize font-medium">Dark</span>
                    </button>
                    <button class="p-2 text-text-muted hover:text-text-main rounded-full hover:bg-bg-card transition-colors relative">
                        <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                        <div class="w-5 h-5 border-2 border-current rounded-full"></div>
                    </button>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 scroll-smooth">
                <!-- Views rendered here -->
            </div>
        </main>

        <!-- Mobile Nav -->
        <div class="md:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-border p-2 z-40 flex justify-around" id="mobile-nav">
            <!-- Mobile nav items injected here -->
        </div>
    </div>

    <!-- Expense Modal -->
    <div id="modal-layer" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md p-4 animate-fadeIn">
        <div class="bg-bg-card rounded-2xl w-full max-w-lg shadow-2xl border border-border flex flex-col max-h-[90vh] scale-100 transition-transform duration-200">
            <div class="flex justify-between items-center p-6 border-b border-border">
                <h2 id="modal-title" class="text-xl font-bold text-text-main">New Expense</h2>
                <button onclick="closeModal()" class="text-text-muted hover:text-text-main transition-transform hover:rotate-90"><i data-lucide="x"></i></button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto space-y-5">
                <!-- Form fields injected here -->
            </div>
            <div class="p-6 border-t border-border flex justify-end gap-3 bg-bg-surface/50 rounded-b-2xl">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-text-muted hover:text-text-main transition-colors hover:bg-bg-surface rounded-lg">Cancel</button>
                <button onclick="saveExpense()" class="px-5 py-2 text-sm font-medium bg-primary hover:bg-primary-hover text-primary-fg rounded-lg shadow-lg shadow-primary/25 transition-all transform hover:translate-y-px primary-btn">Save Expense</button>
            </div>
        </div>
    </div>

    <!-- Custom Dialog Modal (Replaces Confirm/Prompt/Alert) -->
    <div id="dialog-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 animate-fadeIn">
        <div class="bg-bg-card rounded-xl w-full max-w-sm shadow-2xl border border-border flex flex-col scale-100 transition-transform duration-200">
            <div class="p-6">
                <h3 id="dialog-title" class="text-lg font-bold text-text-main mb-2">Title</h3>
                <p id="dialog-text" class="text-sm text-text-muted mb-4">Message goes here...</p>
                <input id="dialog-input" type="text" class="w-full bg-bg-surface border border-border rounded-lg px-3 py-2 text-text-main text-sm outline-none focus:border-primary hidden mb-2" placeholder="Enter value...">
                <div class="flex justify-end gap-3 mt-4">
                    <button id="dialog-cancel" onclick="closeDialog()" class="px-3 py-2 text-sm font-medium text-text-muted hover:text-text-main transition-colors">Cancel</button>
                    <button onclick="onDialogConfirm()" class="px-4 py-2 text-sm font-medium bg-primary hover:bg-primary-hover text-primary-fg rounded-lg shadow-lg transition-all">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- THREE.JS BACKGROUND ANIMATION ---
        
        let scene, camera, renderer, particles, lines;
        let positions, velocities;
        let particleCount = 150; 
        const MAX_PARTICLES = 1200; 
        let mouseX = 0, mouseY = 0;

        // Configuration
        let themeConfig = {
            pColor: new THREE.Color(0x3b82f6),
            lColor: new THREE.Color(0x3b82f6),
            speed: 0.3,
            maxDist: 150
        };

        function initThree() {
            const container = document.getElementById('canvas-container');
            if(!container) return;

            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 800;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            createGeometry(particleCount);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) * 0.1;
                mouseY = (e.clientY - window.innerHeight / 2) * 0.1;
            });

            // Interactive burst on click
            document.addEventListener('mousedown', (e) => {
                const targetId = e.target.id;
                const tagName = e.target.tagName;
                const isContainer = targetId === 'content-area' || targetId === 'app' || tagName === 'MAIN' || tagName === 'BODY';
                
                if (isContainer) {
                    const newCount = Math.min(Math.floor(particleCount * 1.5), MAX_PARTICLES); 
                    themeConfig.maxDist += 40;
                    if(themeConfig.maxDist > 400) themeConfig.maxDist = 150;
                    createGeometry(newCount);
                }
            });

            animate();
        }

        function createGeometry(count) {
            if (particles) { scene.remove(particles); particles.geometry.dispose(); }
            if (lines) { scene.remove(lines); lines.geometry.dispose(); }

            particleCount = count;
            
            const geo = new THREE.BufferGeometry();
            positions = new Float32Array(particleCount * 3);
            velocities = new Float32Array(particleCount * 3);

            for(let i = 0; i < particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 1200;
                positions[i*3+1] = (Math.random() - 0.5) * 1200;
                positions[i*3+2] = (Math.random() - 0.5) * 1200;
                
                velocities[i*3] = (Math.random() - 0.5) * themeConfig.speed * 2;
                velocities[i*3+1] = (Math.random() - 0.5) * themeConfig.speed * 2;
                velocities[i*3+2] = (Math.random() - 0.5) * themeConfig.speed * 2;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const mat = new THREE.PointsMaterial({ 
                color: themeConfig.pColor, 
                size: 3, 
                transparent: true, 
                opacity: 0.8,
                sizeAttenuation: true
            });
            particles = new THREE.Points(geo, mat);
            scene.add(particles);

            const lineMat = new THREE.LineBasicMaterial({ 
                color: themeConfig.lColor, 
                transparent: true, 
                opacity: 0.2
            });
            const lineGeo = new THREE.BufferGeometry();
            lines = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(lines);
        }

        function updateThreeTheme(colorHex) {
            const color = new THREE.Color(colorHex);
            themeConfig.pColor = color;
            themeConfig.lColor = color;

            if (particles && particles.material) {
                particles.material.color = color;
                particles.material.needsUpdate = true;
            }
            if (lines && lines.material) {
                lines.material.color = color;
                lines.material.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            const posArr = particles.geometry.attributes.position.array;
            const linePos = [];

            if(lines && lines.material) {
                lines.material.opacity = 0.15 + Math.sin(Date.now() * 0.002) * 0.1; 
            }

            for(let i = 0; i < particleCount; i++) {
                posArr[i*3] += velocities[i*3];
                posArr[i*3+1] += velocities[i*3+1];
                posArr[i*3+2] += velocities[i*3+2];

                if(Math.abs(posArr[i*3]) > 600) velocities[i*3] *= -1;
                if(Math.abs(posArr[i*3+1]) > 600) velocities[i*3+1] *= -1;
                if(Math.abs(posArr[i*3+2]) > 600) velocities[i*3+2] *= -1;

                for(let j = i + 1; j < particleCount; j++) {
                    const dx = posArr[i*3] - posArr[j*3];
                    const dy = posArr[i*3+1] - posArr[j*3+1];
                    const dz = posArr[i*3+2] - posArr[j*3+2];
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                    if(dist < themeConfig.maxDist) {
                        linePos.push(posArr[i*3], posArr[i*3+1], posArr[i*3+2]);
                        linePos.push(posArr[j*3], posArr[j*3+1], posArr[j*3+2]);
                    }
                }
            }

            particles.geometry.attributes.position.needsUpdate = true;
            lines.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linePos), 3));
            
            scene.rotation.y += 0.0005; 

            renderer.render(scene, camera);
        }

        // --- App Data & State ---
        const DEFAULT_CATEGORIES = [
            { id: 'c1', name: 'Food', budget: 5000, color: '#F87171' },
            { id: 'c2', name: 'Travel', budget: 2000, color: '#60A5FA' },
            { id: 'c3', name: 'Rent', budget: 12000, color: '#34D399' },
            { id: 'c4', name: 'Shopping', budget: 3000, color: '#A78BFA' },
            { id: 'c5', name: 'Utilities', budget: 1500, color: '#FBBF24' },
        ];
        
        const DEFAULT_DEBTS = [
            { id: 1, name: 'Car Loan', total: 150000, paid: 45000, color: '#ef4444' },
            { id: 2, name: 'Credit Card', total: 25000, paid: 5000, color: '#f59e0b' }
        ];
        
        const DEFAULT_SAVINGS = [
            { id: 1, name: 'Emergency Fund', target: 100000, current: 25000, color: '#10b981' },
            { id: 2, name: 'Vacation', target: 50000, current: 12000, color: '#3b82f6' }
        ];

        const DEFAULT_SCHEMA = [
            { id: 'name', label: 'Expense Name', type: 'text', required: true, system: true },
            { id: 'amount', label: 'Amount', type: 'number', required: true, system: true },
            { id: 'date', label: 'Date', type: 'date', required: true, system: true },
            { id: 'category', label: 'Category', type: 'select', required: true, system: true },
            { id: 'paymentMode', label: 'Payment Mode', type: 'select', options: ['Cash', 'UPI', 'Card', 'Bank'], required: false, system: false },
            { id: 'notes', label: 'Notes', type: 'text', required: false, system: false },
            { id: 'tags', label: 'Tags', type: 'text', required: false, system: false, placeholder: 'Comma separated' },
        ];
        const MOCK_DATA = [
            { id: 1, name: 'Grocery Run', amount: 850, category: 'Food', date: '2023-10-15', paymentMode: 'Card', notes: 'Weekly stock', tags: 'home, food' },
            { id: 2, name: 'Uber to Work', amount: 240, category: 'Travel', date: '2023-10-16', paymentMode: 'UPI', notes: '', tags: 'commute' },
            { id: 3, name: 'Rent Oct', amount: 12000, category: 'Rent', date: '2023-10-01', paymentMode: 'Bank', notes: 'Monthly rent', tags: 'fixed' },
        ];
        const DEFAULT_CUSTOM_THEME = {
            '--bg-main': '#23153c',
            '--bg-surface': '#2a1b4e',
            '--bg-card': '#33215a',
            '--text-main': '#e9d5ff',
            '--text-muted': '#a855f7',
            '--text-inverted': '#ffffff',
            '--primary': '#d8b4fe',
            '--primary-hover': '#c084fc',
            '--border-color': '#581c87',
            '--primary-fg': '#1e1b4b'
        };

        const state = {
            activeTab: 'dashboard',
            expenses: JSON.parse(localStorage.getItem('expenses')) || MOCK_DATA,
            categories: JSON.parse(localStorage.getItem('categories')) || DEFAULT_CATEGORIES,
            debts: JSON.parse(localStorage.getItem('debts')) || DEFAULT_DEBTS,
            savings: JSON.parse(localStorage.getItem('savings')) || DEFAULT_SAVINGS,
            schema: JSON.parse(localStorage.getItem('schema')) || DEFAULT_SCHEMA,
            theme: localStorage.getItem('theme') || 'dark', 
            customTheme: JSON.parse(localStorage.getItem('customTheme')) || DEFAULT_CUSTOM_THEME,
            viewMode: 'table', 
            filterCategory: 'All',
            searchTerm: '',
            sortBy: 'date-desc',
            editingId: null,
            calendarDate: new Date()
        };

        function persist() {
            localStorage.setItem('expenses', JSON.stringify(state.expenses));
            localStorage.setItem('categories', JSON.stringify(state.categories));
            localStorage.setItem('debts', JSON.stringify(state.debts));
            localStorage.setItem('savings', JSON.stringify(state.savings));
            localStorage.setItem('schema', JSON.stringify(state.schema));
            localStorage.setItem('theme', state.theme);
            localStorage.setItem('customTheme', JSON.stringify(state.customTheme));
            renderApp();
            applyTheme();
        }

        function hexToRgba(hex, alpha) {
            let r = 0, g = 0, b = 0;
            if (hex.length === 4) {
                r = parseInt(hex[1] + hex[1], 16);
                g = parseInt(hex[2] + hex[2], 16);
                b = parseInt(hex[3] + hex[3], 16);
            } else if (hex.length === 7) {
                r = parseInt(hex.slice(1, 3), 16);
                g = parseInt(hex.slice(3, 5), 16);
                b = parseInt(hex.slice(5, 7), 16);
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function applyTheme() {
            const root = document.documentElement;
            root.setAttribute('data-theme', state.theme);
            const display = document.getElementById('current-theme-display');
            if(display) display.innerText = state.theme;

            let primaryColor = '#3b82f6';

            if (state.theme === 'custom') {
                Object.entries(state.customTheme).forEach(([key, val]) => root.style.setProperty(key, val));
                root.style.setProperty('--primary-light', hexToRgba(state.customTheme['--primary'], 0.15));
                primaryColor = state.customTheme['--primary'];
            } else {
                ['--bg-main', '--bg-surface', '--bg-card', '--text-main', '--text-muted', '--text-inverted', '--primary', '--primary-hover', '--primary-fg', '--border-color', '--primary-light'].forEach(k => root.style.removeProperty(k));
                if(state.theme === 'dark') primaryColor = '#3b82f6';
                if(state.theme === 'light') primaryColor = '#2563eb';
                if(state.theme === 'neon') primaryColor = '#ffd700';
            }
            updateThreeTheme(primaryColor);
        }

        function setTheme(themeName) { state.theme = themeName; persist(); }
        function updateCustomTheme(key, value) { state.customTheme[key] = value; persist(); applyTheme(); }
        function cycleTheme() {
            const themes = ['dark', 'light', 'neon', 'custom'];
            setTheme(themes[(themes.indexOf(state.theme) + 1) % themes.length]);
        }

        const formatCurrency = (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(amount);
        const formatDate = (dateString) => dateString ? new Date(dateString).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';

        function init() {
            initThree();
            applyTheme();
            renderNav();
            renderApp();
        }

        function renderNav() {
            const tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'expenses', label: 'Expenses', icon: 'receipt' },
                { id: 'budgets', label: 'Budgets', icon: 'pie-chart' },
                { id: 'debts', label: 'Debts', icon: 'credit-card' },
                { id: 'savings', label: 'Savings', icon: 'piggy-bank' },
                { id: 'settings', label: 'Settings', icon: 'settings' },
            ];

            const navHTML = tabs.map(tab => `
                <button onclick="switchTab('${tab.id}')" 
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all duration-200 ${state.activeTab === tab.id ? 'bg-primary text-primary-fg shadow-lg shadow-primary/20 transform scale-105' : 'text-text-muted hover:bg-bg-card hover:text-text-main hover:translate-x-1'}">
                    <i data-lucide="${tab.icon}" class="w-5 h-5"></i>
                    ${tab.label}
                </button>
            `).join('');
            
            const mobileHTML = tabs.map(tab => `
                <button onclick="switchTab('${tab.id}')" class="p-3 rounded-xl transition-all active:scale-95 ${state.activeTab === tab.id ? 'text-primary bg-bg-card shadow-md' : 'text-text-muted'}">
                    <i data-lucide="${tab.icon}" class="w-6 h-6"></i>
                </button>
            `).join('');

            document.getElementById('sidebar-nav').innerHTML = navHTML;
            document.getElementById('mobile-nav').innerHTML = mobileHTML;
            document.getElementById('page-title').innerText = state.activeTab;
            lucide.createIcons();
        }

        function switchTab(tabId) { state.activeTab = tabId; renderNav(); renderApp(); }

        function renderApp() {
            const content = document.getElementById('content-area');
            content.innerHTML = ''; 
            if (state.activeTab === 'dashboard') content.innerHTML = getDashboardHTML();
            else if (state.activeTab === 'expenses') content.innerHTML = getExpensesHTML();
            else if (state.activeTab === 'budgets') content.innerHTML = getBudgetsHTML();
            else if (state.activeTab === 'debts') content.innerHTML = getDebtsHTML();
            else if (state.activeTab === 'savings') content.innerHTML = getSavingsHTML();
            else if (state.activeTab === 'settings') content.innerHTML = getSettingsHTML();
            
            lucide.createIcons();
            applyTheme();
            runAnimations();
        }

        function runAnimations() {
            const counters = document.querySelectorAll('.count-up');
            counters.forEach(counter => {
                const target = parseFloat(counter.getAttribute('data-value'));
                if (isNaN(target)) return;
                
                const duration = 1500;
                const start = 0;
                const startTime = performance.now();
                
                function update(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                    const current = start + (target - start) * ease;
                    counter.innerText = formatCurrency(current);
                    if (progress < 1) requestAnimationFrame(update);
                    else counter.innerText = formatCurrency(target);
                }
                requestAnimationFrame(update);
            });
        }

        // --- Dialog Logic ---
        let dialogCallback = null;

        function closeDialog() {
            document.getElementById('dialog-modal').classList.add('hidden');
            dialogCallback = null;
        }

        function showConfirm(message, onConfirm) {
            setupDialog('Confirm Action', message, null, true, onConfirm);
        }

        function showAlert(message) {
            setupDialog('Alert', message, null, false, () => {});
        }

        function showPrompt(title, defaultValue, onConfirm) {
            setupDialog(title, '', defaultValue, true, onConfirm);
        }

        function setupDialog(title, text, inputValue, showCancel, onConfirm) {
            const modal = document.getElementById('dialog-modal');
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-text').innerText = text;
            
            const input = document.getElementById('dialog-input');
            if (inputValue !== null) {
                input.classList.remove('hidden');
                input.value = typeof inputValue === 'string' ? inputValue : '';
                input.focus();
            } else {
                input.classList.add('hidden');
            }

            const cancelBtn = document.getElementById('dialog-cancel');
            if (showCancel) cancelBtn.classList.remove('hidden');
            else cancelBtn.classList.add('hidden');

            dialogCallback = onConfirm;
            modal.classList.remove('hidden');
        }

        function onDialogConfirm() {
            const input = document.getElementById('dialog-input');
            const val = input.value;
            if (dialogCallback) {
                if (!input.classList.contains('hidden')) dialogCallback(val);
                else dialogCallback(); 
            }
            closeDialog();
        }

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fadeIn delay-300">

        function getCalendarHTML(expenses) {
            const year = state.calendarDate.getFullYear();
            const month = state.calendarDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            
            let daysHTML = '';
            for (let i = 0; i < firstDay; i++) {
                daysHTML += `<div class="h-24 md:h-32 bg-bg-surface/30 border border-border/50 backdrop-blur-sm"></div>`;
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayExpenses = expenses.filter(e => e.date === dateStr);
                const total = dayExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
                const isToday = dateStr === new Date().toISOString().split('T')[0];
                
                daysHTML += `
                    <div class="h-24 md:h-32 bg-bg-card border border-border hover:bg-bg-surface transition-colors p-2 flex flex-col justify-between overflow-hidden cursor-pointer group card-hover animate-fadeIn">
                        <span class="text-sm font-medium w-7 h-7 flex items-center justify-center rounded-full transition-all ${isToday ? 'bg-primary text-primary-fg shadow-md' : 'text-text-muted group-hover:bg-bg-surface'}">${day}</span>
                        <div class="space-y-1">
                            ${dayExpenses.slice(0, 2).map(e => `<div class="text-[10px] bg-bg-surface text-text-muted px-1.5 py-0.5 rounded truncate border border-border shadow-sm">${e.name}</div>`).join('')}
                            ${dayExpenses.length > 2 ? `<div class="text-[10px] text-text-muted pl-1">+${dayExpenses.length - 2} more</div>` : ''}
                        </div>
                        ${total > 0 ? `<div class="text-right text-xs font-bold text-primary">${formatCurrency(total)}</div>` : ''}
                    </div>
                `;
            }

            return `
                 <div class="bg-bg-card rounded-xl border border-border overflow-hidden neon-border shadow-lg animate-fadeIn">
                    <div class="p-4 flex items-center justify-between border-b border-border bg-bg-surface/30">
                        <h2 class="text-lg font-bold text-text-main tracking-wide">${state.calendarDate.toLocaleString('default', { month: 'long', year: 'numeric' })}</h2>
                        <div class="flex gap-2">

                    </div>
                    <div class="grid grid-cols-7">
                        ${daysHTML}
                    </div>
                 </div>
            `;
        }

        function getBudgetsHTML() {

                <div class="col-span-1 md:col-span-2 flex flex-col items-center justify-center p-12 text-center text-text-muted border-2 border-dashed border-border rounded-xl animate-fadeIn">

                        <div class="border-b border-border pb-4 mb-6">
                            <h2 class="text-xl font-bold text-text-main">Field Customization</h2>
                            <p class="text-text-muted text-sm mt-1">Manage the properties tracked for each expense.</p>
                        </div>
                        <div class="space-y-3">
                            ${state.schema.map(field => `
                                <div class="flex items-center justify-between bg-bg-surface p-3 rounded-lg border border-border hover:border-primary/50 transition-colors">

                            `).join('')}
                        </div>
                        <div class="mt-8 pt-6 border-t border-border">

                                <div class="md:col-span-2">

                                    <input name="label" required type="text" class="w-full bg-bg-surface border border-border rounded-lg px-3 py-2 text-text-main text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder-text-muted transition-all" placeholder="e.g., Receipt URL">

                                    <label class="block text-xs font-medium text-text-muted mb-1">Type</label>

                                        <option value="text">Text</option>
                                        <option value="number">Number</option>
                                        <option value="date">Date</option>
                                    </select>
                                </div>
                                <button type="submit" class="w-full bg-bg-surface hover:bg-bg-main border border-border text-text-main font-medium rounded-lg px-4 py-2 transition-colors hover:border-primary hover:text-primary">Add Field</button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Interaction Handlers ---
        
        function openModal(id = null) {
            state.editingId = id;
            const modal = document.getElementById('modal-layer');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            title.innerText = id ? 'Edit Expense' : 'New Expense';
            modal.classList.remove('hidden');

            const item = id ? state.expenses.find(e => String(e.id) === String(id)) : {};
            const today = new Date().toISOString().split('T')[0];

            body.innerHTML = state.schema.map(field => {
                const val = item[field.id] || (field.id === 'date' && !id ? today : '');
                const commonClasses = "w-full bg-bg-surface border border-border rounded-lg px-3 py-2.5 text-text-main outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all";
                
                if (field.type === 'select' && field.id === 'category') {
                    return `
                        <div>
                            <label class="block text-sm font-medium text-text-muted mb-1.5">${field.label}</label>
                            <select id="field-${field.id}" class="${commonClasses}">
                                <option value="">Select Category</option>
                                ${state.categories.map(c => `<option value="${c.name}" ${val === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
                            </select>
                        </div>
                    `;
                }
                
                if (field.type === 'select') {
                    return `
                        <div>
                            <label class="block text-sm font-medium text-text-muted mb-1.5">${field.label}</label>
                            <select id="field-${field.id}" class="${commonClasses}">
                                ${field.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}
                            </select>
                        </div>
                    `;
                }

                return `
                    <div>
                        <label class="block text-sm font-medium text-text-muted mb-1.5">${field.label}</label>
                        <input type="${field.type}" id="field-${field.id}" value="${val}" class="${commonClasses}" ${field.required ? 'required' : ''}>
                    </div>
                `;
            }).join('');
        }

        function closeModal() {
            document.getElementById('modal-layer').classList.add('hidden');
            state.editingId = null;
        }

        function saveExpense() {
            const newItem = { id: state.editingId || Date.now() };
            let isValid = true;

            state.schema.forEach(field => {
                const el = document.getElementById(`field-${field.id}`);
                if (field.required && !el.value) isValid = false;
                newItem[field.id] = el.value;
            });

            if (!isValid) {
                showAlert('Please fill in all required fields');
                return;
            }

            if (state.editingId) {
                state.expenses = state.expenses.map(e => String(e.id) === String(state.editingId) ? newItem : e);
            } else {
                state.expenses.push(newItem);
            }
            
            closeModal();
            persist();
        }

        function deleteExpense(id) {
            showConfirm("Delete this expense?", () => {
                state.expenses = state.expenses.filter(e => String(e.id) !== String(id));
                persist();
            });
        }

        function handleSearch(val) { state.searchTerm = val; renderApp(); }
        function handleFilter(val) { state.filterCategory = val; renderApp(); }
        function handleSort(val) { state.sortBy = val; renderApp(); }
        function changeView(mode) { state.viewMode = mode; renderApp(); }
        function changeMonth(delta) { 
            state.calendarDate.setMonth(state.calendarDate.getMonth() + delta);
            renderApp();
        }

        function addDebt() {
            showPrompt("Debt Name", "", (name) => {
                if(name) {
                    showPrompt("Total Debt Amount", "0", (total) => {
                        showPrompt("Amount Already Paid", "0", (paid) => {
                            const color = '#' + Math.floor(Math.random()*16777215).toString(16);
                            state.debts.push({ 
                                id: Date.now(), 
                                name, 
                                total: Number(total), 
                                paid: Number(paid), 
                                color 
                            });
                            persist();
                        });
                    });
                }
            });
        }

        function deleteDebt(id) {
            showConfirm("Remove this debt?", () => {
                state.debts = state.debts.filter(d => String(d.id) !== String(id));
                persist();
            });
        }

        function updateDebtAmount(id) {
            const debt = state.debts.find(d => String(d.id) === String(id));
            if(!debt) return;
            showPrompt("Enter payment amount to add", "0", (amount) => {
                if(amount && !isNaN(amount)) {
                    debt.paid += Number(amount);
                    if(debt.paid > debt.total) debt.paid = debt.total; 
                    persist();
                }
            });
        }

        function editDebt(id) {
            const debt = state.debts.find(d => String(d.id) === String(id));
            if(!debt) return;
            
            showPrompt("Edit Debt Name", debt.name, (name) => {
                if (name) {
                    showPrompt("Edit Total Debt Amount", debt.total, (total) => {
                        showPrompt("Edit Amount Paid So Far", debt.paid, (paid) => {
                            if (total && !isNaN(total)) debt.total = Number(total);
                            if (paid && !isNaN(paid)) debt.paid = Number(paid);
                            debt.name = name;
                            persist();
                        });
                    });
                }
            });
        }

        function addSavingsGoal() {
            showPrompt("Goal Name", "", (name) => {
                if (name) {
                    showPrompt("Target Amount", "0", (target) => {
                        showPrompt("Current Savings", "0", (current) => {
                            const color = '#' + Math.floor(Math.random()*16777215).toString(16);
                            state.savings.push({ 
                                id: Date.now(), 
                                name, 
                                target: Number(target), 
                                current: Number(current), 
                                color 
                            });
                            persist();
                        });
                    });
                }
            });
        }

        function deleteSavings(id) {
            showConfirm("Remove this savings goal?", () => {
                state.savings = state.savings.filter(s => String(s.id) !== String(id));
                persist();
            });
        }

        function updateSavingsAmount(id, isDeposit) {
            const goal = state.savings.find(s => String(s.id) === String(id));
            if(!goal) return;
            showPrompt(`Enter amount to ${isDeposit ? 'deposit' : 'withdraw'}`, "0", (amount) => {
                if(amount && !isNaN(amount)) {
                    if(isDeposit) {
                        goal.current += Number(amount);
                    } else {
                        goal.current -= Number(amount);
                        if(goal.current < 0) goal.current = 0;
                    }
                    persist();
                }
            });
        }

        function editBudget(id) {
            const cat = state.categories.find(c => String(c.id) === String(id));
            if (!cat) return;
            showPrompt(`New budget for ${cat.name}`, cat.budget, (newB) => {
                if(newB && !isNaN(newB)) { 
                    cat.budget = Number(newB); 
                    persist(); 
                }
            });
        }

        function deleteField(id) { 
            showConfirm("Remove this field?", () => {
                state.schema = state.schema.filter(f => f.id !== id); 
                persist(); 
            });
        }

        function addCustomField(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            state.schema.push({
                id: formData.get('label').toLowerCase().replace(/\s+/g, '_'),
                label: formData.get('label'),
                type: formData.get('type'),
                required: false,
                system: false
            });
            persist();
        }

        function addCategory() {
            showPrompt("Category Name", "", (name) => {
                if(name) {
                    showPrompt("Budget Amount", "0", (budget) => {
                        const color = '#' + Math.floor(Math.random()*16777215).toString(16);
                        state.categories.push({ id: Date.now(), name, budget: Number(budget), color });
                        persist();
                    });
                }
            });
        }

        init();
    </script>
</body>
</html>
